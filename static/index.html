<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>DB Auto Baccarat</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: #0c101c; color: #fff; overflow: hidden; height: 100vh; display: flex; flex-direction: column; }
    .header { height: 40px; background: rgba(0,0,0,0.9); display: flex; justify-content: space-between; align-items: center; padding: 0 10px; border-bottom: 1px solid #222; font-size: 12px; }
    .balance-box { background: rgba(255,215,0,0.15); border: 1px solid #ffd700; color: #ffd700; padding: 3px 8px; border-radius: 15px; font-weight: bold; }
    .live-area { position: relative; width: 100%; height: 190px; background: #050505; display: flex; justify-content: center; align-items: center; border-bottom: 2px solid #333; }
    .dealer-canvas { position: absolute; width: 100%; height: 100%; }
    .timer-badge { position: absolute; top: 10px; width: 40px; height: 40px; border-radius: 50%; background: rgba(0,0,0,0.7); border: 3px solid #e53e3e; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: bold; color: #ffd700; z-index: 10; }
    .game-status-text { position: absolute; top: 55px; font-size: 11px; font-weight: bold; background: rgba(0,0,0,0.6); padding: 2px 8px; border-radius: 4px; color: #38a169; z-index: 10; }
    .cards-display { position: absolute; bottom: 8px; display: flex; gap: 15px; z-index: 5; }
    .side-cards { display: flex; flex-direction: column; align-items: center; background: rgba(0,0,0,0.7); padding: 4px 8px; border-radius: 6px; }
    .side-title { font-size: 10px; font-weight: bold; margin-bottom: 2px; }
    .player-text { color: #3182ce; } .banker-text { color: #e53e3e; }
    .cards-wrapper { display: flex; gap: 3px; }
    .card-img { width: 28px; height: 40px; background: #fff; color: #000; border-radius: 3px; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 12px; }
    .betting-table { flex: 1; padding: 6px; display: flex; flex-direction: column; gap: 4px; background: #0b132b; }
    .row-side-bets, .row-main-bets { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 4px; }
    .row-main-bets { flex: 1; }
    .bet-box { background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.15); border-radius: 6px; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 4px; position: relative; cursor: pointer; }
    .bet-box.player { border-color: #3182ce; background: rgba(49,130,206,0.12); }
    .bet-box.banker { border-color: #e53e3e; background: rgba(229,62,62,0.12); }
    .bet-box.tie { border-color: #38a169; background: rgba(56,161,105,0.12); }
    .bet-title { font-size: 12px; font-weight: bold; }
    .bet-odds { font-size: 9px; color: #aaa; }
    .bet-amount { position: absolute; top: 2px; right: 4px; font-size: 9px; background: #ffd700; color: #000; padding: 1px 4px; border-radius: 8px; font-weight: bold; display: none; }
    .chips-rack { height: 46px; background: #1c2541; display: flex; align-items: center; justify-content: space-around; padding: 0 6px; border-top: 1px solid #333; }
    .chip { width: 34px; height: 34px; border-radius: 50%; border: 2px dashed #fff; display: flex; align-items: center; justify-content: center; font-size: 9px; font-weight: bold; cursor: pointer; }
    .chip.selected { border: 3px solid #ffd700; transform: translateY(-3px); }
    .chip-100 { background: #4a5568; } .chip-500 { background: #3182ce; } .chip-1k { background: #38a169; }
    .roadmap-container { height: 50px; background: #000; border-top: 1px solid #222; display: flex; align-items: center; padding: 4px; overflow-x: auto; }
    .roadmap-grid { display: grid; grid-template-rows: repeat(5, 8px); grid-auto-flow: column; gap: 2px; }
    .dot { width: 8px; height: 8px; border-radius: 50%; }
    .dot-P { background: #3182ce; } .dot-B { background: #e53e3e; } .dot-T { background: #38a169; }
  </style>
</head>
<body>
  <div class="header">
    <div>🔴 DB AUTO BACCARAT</div>
    <div class="balance-box">💰 <span id="balance">0</span> Xu</div>
  </div>

  <div class="live-area">
    <canvas id="dealerCanvas" class="dealer-canvas" width="400" height="190"></canvas>
    <div class="timer-badge" id="timer">15</div>
    <div class="game-status-text" id="gameStatus">ĐANG NHẬN CƯỢC</div>
    <div class="cards-display">
      <div class="side-cards">
        <div class="side-title player-text">PLAYER (<span id="p-score">0</span>)</div>
        <div class="cards-wrapper" id="player-cards"><div class="card-img">?</div><div class="card-img">?</div></div>
      </div>
      <div class="side-cards">
        <div class="side-title banker-text">BANKER (<span id="b-score">0</span>)</div>
        <div class="cards-wrapper" id="banker-cards"><div class="card-img">?</div><div class="card-img">?</div></div>
      </div>
    </div>
  </div>

  <div class="betting-table">
    <div class="row-side-bets">
      <div class="bet-box" onclick="placeBet('P_PAIR')"><div class="bet-title player-text">P.PAIR</div><div class="bet-odds">1:11</div><div class="bet-amount" id="bet-P_PAIR">0</div></div>
      <div class="bet-box" onclick="placeBet('LUCKY6')"><div class="bet-title" style="color:#ffd700;">LUCKY 6</div><div class="bet-odds">1:12</div><div class="bet-amount" id="bet-LUCKY6">0</div></div>
      <div class="bet-box" onclick="placeBet('B_PAIR')"><div class="bet-title banker-text">B.PAIR</div><div class="bet-odds">1:11</div><div class="bet-amount" id="bet-B_PAIR">0</div></div>
    </div>
    <div class="row-main-bets">
      <div class="bet-box player" onclick="placeBet('PLAYER')"><div class="bet-title player-text">PLAYER</div><div class="bet-odds">1:1</div><div class="bet-amount" id="bet-PLAYER">0</div></div>
      <div class="bet-box tie" onclick="placeBet('TIE')"><div class="bet-title" style="color:#38a169;">HÒA</div><div class="bet-odds">1:8</div><div class="bet-amount" id="bet-TIE">0</div></div>
      <div class="bet-box banker" onclick="placeBet('BANKER')"><div class="bet-title banker-text">BANKER</div><div class="bet-odds">1:0.95</div><div class="bet-amount" id="bet-BANKER">0</div></div>
    </div>
  </div>

  <div class="chips-rack">
    <div class="chip chip-100 selected" onclick="selectChip(100, this)">100</div>
    <div class="chip chip-500" onclick="selectChip(500, this)">500</div>
    <div class="chip chip-1k" onclick="selectChip(1000, this)">1k</div>
  </div>

  <div class="roadmap-container"><div class="roadmap-grid" id="roadmapGrid"></div></div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) tg.expand();
    
    // Lấy Telegram ID thực tế của người mở game
    const telegramId = tg?.initDataUnsafe?.user?.id ? String(tg.initDataUnsafe.user.id) : "test_user";

    let selectedChipValue = 100;
    let currentBets = {};
    let userBalance = 0;
    let historyResults = ['P', 'B', 'P', 'T', 'B'];
    let timeLeft = 15;
    let isBettingPhase = true;

    async function fetchBalance() {
      try {
        let res = await fetch(`/api/user/${telegramId}`);
        let data = await res.json();
        userBalance = data.balance;
        updateUI();
      } catch (e) { console.log(e); }
    }

    function initDealerAnimation() {
      const canvas = document.getElementById('dealerCanvas');
      const ctx = canvas.getContext('2d');
      let angle = 0;
      function draw() {
        ctx.fillStyle = '#080c14'; ctx.fillRect(0, 0, canvas.width, canvas.height);
        let offset = Math.sin(angle) * 3;
        ctx.fillStyle = '#475569'; ctx.beginPath(); ctx.arc(200, 55 + offset, 22, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#991b1b'; ctx.beginPath(); ctx.ellipse(200, 155, 170, 35, 0, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = '#eab308'; ctx.lineWidth = 2; ctx.stroke();
        angle += 0.03;
        requestAnimationFrame(draw);
      }
      draw();
    }

    function selectChip(val, el) {
      document.querySelectorAll('.chip').forEach(c => c.classList.remove('selected'));
      el.classList.add('selected');
      selectedChipValue = val;
    }

    function placeBet(type) {
      if (!isBettingPhase) { alert("Đang mở bài, vui lòng đợi ván mới!"); return; }
      if (userBalance < selectedChipValue) { alert("Bạn không đủ xu! Hãy qua Bot Telegram điểm danh nhận thêm xu."); return; }
      
      if (!currentBets[type]) currentBets[type] = 0;
      currentBets[type] += selectedChipValue;
      userBalance -= selectedChipValue;
      updateUI();
    }

    function updateUI() {
      document.getElementById('balance').innerText = userBalance.toLocaleString();
      ['PLAYER', 'BANKER', 'TIE', 'P_PAIR', 'B_PAIR', 'LUCKY6'].forEach(type => {
        const el = document.getElementById(`bet-${type}`);
        if (currentBets[type] && currentBets[type] > 0) {
          el.innerText = currentBets[type].toLocaleString();
          el.style.display = 'block';
        } else { el.style.display = 'none'; }
      });
    }

    function renderRoadmap() {
      const grid = document.getElementById('roadmapGrid');
      grid.innerHTML = '';
      historyResults.forEach(res => {
        const dot = document.createElement('div');
        dot.className = `dot dot-${res}`;
        grid.appendChild(dot);
      });
    }

    async function startTimerLoop() {
      setInterval(async () => {
        if (timeLeft > 0) {
          timeLeft--;
          document.getElementById('timer').innerText = timeLeft;
          if (timeLeft === 0) {
            isBettingPhase = false;
            document.getElementById('gameStatus').innerText = "ĐANG MỞ BÀI...";
            
            if (Object.keys(currentBets).length > 0) {
              let res = await fetch('/api/deal', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ bets: currentBets, telegram_id: telegramId })
              });
              let data = await res.json();
              if(!data.error) {
                document.getElementById('player-cards').innerHTML = data.player_cards.map(c => `<div class="card-img">${c}</div>`).join('');
                document.getElementById('banker-cards').innerHTML = data.banker_cards.map(c => `<div class="card-img">${c}</div>`).join('');
                document.getElementById('p-score').innerText = data.player_score;
                document.getElementById('b-score').innerText = data.banker_score;
                userBalance = data.new_balance;
                historyResults.push(data.winner_code);
                if (historyResults.length > 40) historyResults.shift();
                renderRoadmap();
              }
            }

            setTimeout(() => {
              timeLeft = 15;
              isBettingPhase = true;
              currentBets = {};
              document.getElementById('gameStatus').innerText = "ĐANG NHẬN CƯỢC";
              updateUI();
              fetchBalance();
            }, 5000);
          }
        }
      }, 1000);
    }

    initDealerAnimation();
    fetchBalance();
    renderRoadmap();
    startTimerLoop();
  </script>
</body>
</html>
